  return `<p><b>${msgs.length} posted (newest first)</b></p>` + msgs.map(m => editingMsg === m.id
    ? `<div class="card"><textarea id="medit" rows="4">${esc(m.text)}</textarea><label>Message in Marathi (optional – clients on MAR see this)</label><textarea id="meditmr" rows="4">${esc(m.textMr || "")}</textarea><button class="sm" data-act="saveMsg" data-id="${m.id}">Save</button><button class="sm gold" data-act="cancelMsg">Cancel</button></div>`
    : `<div class="card"><small>🕒 ${esc(fmt(m.createdAt))}${m.updatedAt && m.updatedAt > m.createdAt ? " · edited" : ""}</small><p>${esc(m.text)}</p>${m.textMr ? `<p>${esc(m.textMr)}</p>` : ""}<button class="sm" data-act="editMsg" data-id="${m.id}">Edit</button><button class="sm del" data-act="delMsg" data-id="${m.id}">Delete</button></div>`).join("");
}
function refreshMsgList(){ const el = $("msglist"); if (el && editingMsg === null) el.innerHTML = msgListAdmin(); }

function svcEditor(){
  const mrv = (v, en) => esc(v ?? MR[en] ?? "");
  return `<p><b>Edit services and timings, then tap Save services.</b></p>` + svcDraft.map((s,i) => `<div class="card"><label>Service name</label><input data-f="name" data-i="${i}" value="${esc(s.name)}">
    <label>Service name (Marathi)</label><input data-f="name_mr" data-i="${i}" value="${mrv(s.name_mr, s.name)}">
    <label>Route / description (shown under the name)</label><input data-f="sub" data-i="${i}" value="${esc(s.sub)}">
    <label>Route / description (Marathi)</label><input data-f="sub_mr" data-i="${i}" value="${mrv(s.sub_mr, s.sub)}">
    <label class="chk"><input type="checkbox" data-f="od" data-i="${i}" ${isOD(s) ? "checked" : ""}> On Demand Service (clients can send an enquiry for it)</label>
    <label>Fare per person ₹ (0 = hide fare)</label><input data-f="fare" data-i="${i}" type="number" inputmode="numeric" value="${esc(s.fare)}">
    ${(s.groups || []).map((gr,j) => `<div class="grp"><label>Direction heading (e.g. From Mora)</label><input data-f="label" data-i="${i}" data-j="${j}" value="${esc(gr.label)}">
      <label>Direction heading (Marathi)</label><input data-f="label_mr" data-i="${i}" data-j="${j}" value="${mrv(gr.label_mr, gr.label)}">
      <label>Timings</label><div class="trow">${(gr.times || []).map((t,k) => `<span class="tin"><input data-f="time" data-i="${i}" data-j="${j}" data-k="${k}" value="${esc(t)}" placeholder="07:00 AM"><button data-act="delTime" data-i="${i}" data-j="${j}" data-k="${k}">✕</button></span>`).join("")}</div>
      <button class="sm" data-act="addTime" data-i="${i}" data-j="${j}">+ Add timing</button><button class="sm del" data-act="delGroup" data-i="${i}" data-j="${j}">Remove direction</button></div>`).join("")}
    <button class="sm" data-act="addGroup" data-i="${i}">+ Add direction</button><button class="sm del" data-act="delSvc" data-i="${i}">Delete service</button></div>`).join("")
    + `<button class="sm" data-act="addSvc">+ Add service</button><div id="msg"></div><button class="full" id="svsave">Save services</button>`;
}
$("app").addEventListener("input", e => {
  const t = e.target, f = t.dataset.f; if (!f || !svcDraft) return;
  const s = svcDraft[+t.dataset.i], j = +t.dataset.j, k = +t.dataset.k;
  if (f === "name") s.name = t.value; else if (f === "name_mr") s.name_mr = t.value; else if (f === "sub_mr") s.sub_mr = t.value; else if (f === "label_mr") s.groups[j].label_mr = t.value; else if (f === "sub") s.sub = t.value; else if (f === "fare") s.fare = t.value; else if (f === "label") s.groups[j].label = t.value; else if (f === "time") s.groups[j].times[k] = t.value;
});
$("app").addEventListener("change", e => { const t = e.target; if (t.dataset.f === "od" && svcDraft) svcDraft[+t.dataset.i].onDemand = t.checked; });
$("app").addEventListener("click", e => {
  const lb = e.target.closest("[data-lb]"); if (lb) { $("lb").querySelector("img").src = lb.src; $("lb").style.display = "flex"; return; }
  const tb = e.target.closest("[data-t]"); if (tb) { adminTab = tb.dataset.t; editingMsg = null; if (adminTab !== "svc") svcDraft = null; render(); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j, k = +b.dataset.k, id = b.dataset.id;
  if (a === "setHome") { cfg.doc("content").set({home_img_id:id}, {merge:true}); return; }
  if (a === "delPic") { if (confirm(T("Delete this photo?"))) { db.collection("gallery").doc(id).delete(); if (C.home_img_id === id) cfg.doc("content").set({home_img_id:""}, {merge:true}); } return; }
  if (a === "delRec") { if (confirm(T("Delete this record?"))) db.collection(b.dataset.col).doc(id).delete(); return; }
  if (a === "confirmEnq") { db.collection("enquiries").doc(id).update({status:"confirmed", confirmedAt:Date.now()}); return; }
  if (a === "cancelEnq") { if (confirm(T("Cancel this enquiry? It will also be removed from the client's My Booking."))) db.collection("enquiries").doc(id).delete(); return; }
  if (a === "revertBook") { if (confirm(T("Cancel this booking and move it back to Enquiry?"))) db.collection("enquiries").doc(id).update({status:"enquiry", confirmedAt:firebase.firestore.FieldValue.delete()}); return; }
  if (a === "myCancel") { if (confirm(T("Cancel this booking? It will be removed everywhere."))) db.collection("enquiries").doc(id).delete().catch(() => alert(T("Could not cancel. Please call us."))); return; }
  if (a === "editMsg") { editingMsg = id; $("msglist").innerHTML = msgListAdmin(); return; }
  if (a === "cancelMsg") { editingMsg = null; refreshMsgList(); return; }
  if (a === "saveMsg") { const t = $("medit").value.trim(); if (!t) return; db.collection("messages").doc(id).update({text:t, textMr:($("meditmr").value || "").trim(), updatedAt:Date.now()}); editingMsg = null; refreshMsgList(); return; }
  if (a === "delMsg") { if (confirm(T("Delete this message for all clients?"))) db.collection("messages").doc(id).delete(); return; }
  if (!svcDraft) return;
  if (a === "addSvc") svcDraft.push({name:"New service", sub:"", onDemand:false, fare:"0", groups:[{label:"From Mora", times:[""]}]});
  else if (a === "delSvc") { if (!confirm(T("Delete this service?"))) return; svcDraft.splice(i, 1); }
  else if (a === "addGroup") svcDraft[i].groups.push({label:"New direction", times:[""]});
  else if (a === "delGroup") svcDraft[i].groups.splice(j, 1);
  else if (a === "addTime") svcDraft[i].groups[j].times.push("");
  else if (a === "delTime") svcDraft[i].groups[j].times.splice(k, 1);
  else return;
  render();
});
$("lb").onclick = () => { $("lb").style.display = "none"; };

function initAdmin(){
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("go", () => { $("go").disabled = true; auth.signInWithEmailAndPassword($("ae").value.trim(), $("ap").value)
    .catch(() => { $("go").disabled = false; $("msg").innerHTML = '<span class="err">Login failed. Check email, password and internet.</span>'; }); });
  on("out", () => auth.signOut());
  on("mpost", () => { const t = $("mtext").value.trim(); if (!t) { $("msg").innerHTML = '<span class="err">Type a message first.</span>'; return; }
    const n = Date.now(); db.collection("messages").add({text:t, textMr:$("mtextmr").value.trim(), createdAt:n, updatedAt:n})
      .then(() => { $("mtext").value = ""; $("mtextmr").value = ""; $("msg").innerHTML = '<span class="ok">✔ Posted. Clients can see it now.</span>'; })
      .catch(() => $("msg").innerHTML = '<span class="err">Could not post. Check you are logged in and the database rules are updated.</span>'); });
  on("save", () => { const o = {}; document.querySelectorAll("[data-k]").forEach(t => o[t.dataset.k] = t.value.trim());
    cfg.doc("content").set(o, {merge:true}).then(() => $("msg").innerHTML = '<span class="ok">✔ Saved. Clients now see the changes.</span>').catch(() => $("msg").innerHTML = '<span class="err">Could not save.</span>'); });
  on("svsave", () => { const items = svcDraft.map(s => ({name:s.name.trim() || "Service", sub:(s.sub || "").trim(), name_mr:(s.name_mr ?? MR[s.name] ?? "").trim(), sub_mr:(s.sub_mr ?? MR[s.sub] ?? "").trim(), onDemand:isOD(s), fare:String(s.fare || "0"),
      groups:(s.groups || []).map(gr => ({label:gr.label.trim(), label_mr:(gr.label_mr ?? MR[gr.label] ?? "").trim(), times:gr.times.map(t => t.trim()).filter(Boolean)}))}));
    cfg.doc("services").set({items}).then(() => $("msg").innerHTML = '<span class="ok">✔ Services saved. Clients now see the new timings.</span>').catch(() => $("msg").innerHTML = '<span class="err">Could not save.</span>'); });
  const f = $("f"); if (f) f.onchange = async () => { $("msg").textContent = "Uploading..."; for (const file of f.files) await addPhoto(file); $("msg").textContent = "Done."; f.value = ""; };
  const en = $("locEn"); if (en) { en.onchange = () => cfg.doc("location").set({enabled:en.checked}, {merge:true}); locStatus(); }
  const au = $("locAuto"); if (au) au.onchange = async () => { if (au.checked) { await startTrack(); au.checked = !!watch; } else stopTrack(); };
  on("locSave", () => { const la = parseFloat($("lat").value), ln = parseFloat($("lng").value);
    if (isNaN(la) || isNaN(ln)) { $("msg").innerHTML = '<span class="err">Enter valid latitude and longitude.</span>'; return; } sendLoc(la, ln); $("msg").innerHTML = '<span class="ok">✔ Saved.</span>'; });
  on("locNow", async () => { try { const p = await getPos(); $("lat").value = p.latitude; $("lng").value = p.longitude; sendLoc(p.latitude, p.longitude); $("msg").innerHTML = '<span class="ok">✔ Location updated.</span>'; }
    catch (e) { $("msg").innerHTML = '<span class="err">Could not read GPS. Allow location permission.</span>'; } });
}
function locStatus(){ const el = $("locstat"); if (el) el.innerHTML = `<small>Clients see: ${L.enabled ? "<b>location ON</b>" : "<b>location OFF</b>"}${L.updatedAt ? " · last update " + esc(ago(L.updatedAt)) : ""}</small>`; }

// ---------- GPS ----------
const cap = () => window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Geolocation;
function sendLoc(lat, lng){ cfg.doc("location").set({lat, lng, updatedAt:Date.now()}, {merge:true}); }
function getPos(){ const c = cap(); if (c) return c.getCurrentPosition({enableHighAccuracy:true}).then(p => p.coords);
  return new Promise((ok, no) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => ok(p.coords), no, {enableHighAccuracy:true}) : no()); }
async function startTrack(){
  const on = p => { if (!p) return; const n = Date.now(); if (n - lastSend < 15000) return; lastSend = n; sendLoc(p.coords.latitude, p.coords.longitude); };
  try { const c = cap();
    if (c) { await c.requestPermissions(); watch = {c, id: await c.watchPosition({enableHighAccuracy:true}, (p) => on(p))}; }
    else if (navigator.geolocation) watch = {id: navigator.geolocation.watchPosition(on, () => alert(T("Could not read GPS. Allow location permission.")), {enableHighAccuracy:true, maximumAge:10000})};
  } catch (e) { alert(T("Location permission is needed.")); }
}
function stopTrack(){ if (!watch) return; try { watch.c ? watch.c.clearWatch({id:watch.id}) : navigator.geolocation.clearWatch(watch.id); } catch (e) {} watch = null; }

// ---------- PHOTO UPLOAD (stored inside Firestore, no paid Storage needed) ----------
function addPhoto(file){ return new Promise(res => {
  const done = data => db.collection("gallery").add({...data, createdAt:Date.now()}).then(res, res);
  if (file.type === "image/gif" && file.size < 700 * 1024) { const r = new FileReader(); r.onload = () => done({data:String(r.result).split(",")[1], mime:"image/gif"}); r.onerror = res; r.readAsDataURL(file); return; }
  const img = new Image(); img.onload = () => {
    const s = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src); done({data:c.toDataURL("image/jpeg", .72).split(",")[1], mime:"image/jpeg"}); };
  img.onerror = res; img.src = URL.createObjectURL(file); }); }

$("hdr").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
new MutationObserver(ms => { if (lang !== "mr") return; ms.forEach(m => { if (m.type === "characterData") trNode(m.target); m.addedNodes.forEach(trNode); }); })
  .observe(document.body, {childList:true, subtree:true, characterData:true});
document.documentElement.lang = lang === "mr" ? "mr" : "en";
render();
if ("serviceWorker" in navigator && !window.Capacitor && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
