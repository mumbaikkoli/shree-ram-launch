async function translate(text, from, to){      // returns the translation, or null when it could not be done

// ---------- FUN: Take Picture (camera only, 5 per day, Picture of the Day) ----------
// A "fun day" starts at 07:00 IST. Open 07:00-16:00, winner picked from 16:00, everything removed at the next 07:00.
const FUN_CLOSE = 32400000, FUN_MAX = 5;
const fday = () => Math.floor((Date.now() - 5400000) / 86400000);
const foff = () => (Date.now() - 5400000) % 86400000;
const fsrc = p => "data:image/jpeg;base64," + p.data;
let fpics = [], fcount = 0, fwin = null, funDay = -1, funUnsubs = [], funWanted = false, funNote = "", camStream = null, camFacing = "user", camShot = null, memDev = "";
let picking = false, emptyDay = -1, cleaning = false, cleanedDay = -1;
const devId = () => { try { let d = localStorage.getItem("shreeram_dev"); if (!d) { d = newId(); localStorage.setItem("shreeram_dev", d); } return d; } catch (e) { return memDev || (memDev = newId()); } };
function subFun(){
  funWanted = true; const d = fday(); if (d === funDay) return;
  funDay = d; funUnsubs.forEach(f => f()); funUnsubs = []; fpics = []; fwin = null; fcount = 0;
  funUnsubs.push(db.collection("funPics").where("day", "==", d).onSnapshot(q => { fpics = q.docs.map(x => ({id:x.id, ...x.data()})); dataChanged(); }, () => {}));
  funUnsubs.push(db.collection("funDays").doc(String(d)).onSnapshot(x => { fcount = x.exists ? (x.data().count || 0) : 0; dataChanged(); }, () => {}));
  funUnsubs.push(db.collection("funWinner").doc(String(d)).onSnapshot(x => { fwin = x.exists ? x.data() : null; dataChanged(); }, () => {}));
}
async function ensureWinner(){            // after 4 PM the first phone that notices picks one picture at random
  const d = fday(); if (picking || fwin || foff() < FUN_CLOSE || (emptyDay === d && !fpics.length)) return; picking = true;
  try { const ref = db.collection("funWinner").doc(String(d)); if ((await ref.get()).exists) return;
    const q = await db.collection("funPics").where("day", "==", d).get(); if (q.empty) { emptyDay = d; return; }
    await ref.set({pic:q.docs[Math.floor(Math.random() * q.size)].id, at:Date.now(), day:d}); }
  catch (e) {} finally { picking = false; }
}
const delAll = async docs => { for (let i = 0; i < docs.length; i += 400) { const b = db.batch(); docs.slice(i, i + 400).forEach(x => b.delete(x.ref)); await b.commit().catch(() => {}); } };
async function funCleanup(){               // removes yesterday's pictures and, after the draw, today's other pictures
  const d = fday(), extra = fwin ? fpics.filter(p => p.id !== fwin.pic) : [];
  if (cleaning || (cleanedDay === d && !extra.length)) return; cleaning = true;
  try { if (cleanedDay !== d) { for (const col of ["funPics","funWinner","funDays"]) { const q = await db.collection(col).where("day", "<", d).get(); await delAll(q.docs); } cleanedDay = d; }
    for (const p of extra) await db.collection("funPics").doc(p.id).delete().catch(() => {}); }
  catch (e) {} finally { cleaning = false; }
}
function tick(){ if (!funWanted) return; subFun(); ensureWinner(); funCleanup(); dataChanged(); }
async function adminDelFun(id){
  const p = fpics.find(x => x.id === id); if (!p) return; const b = db.batch();
  b.delete(db.collection("funPics").doc(id));
  if (!fwin && p.day === fday()) b.set(db.collection("funDays").doc(String(p.day)), {count:firebase.firestore.FieldValue.increment(-1)}, {merge:true});   // frees the slot
  await b.commit();
}
function funState(){
  const n = Math.max(fcount, fpics.length), mine = fpics.find(p => p.owner === devId());
  if (fwin || foff() >= FUN_CLOSE) return {n, can:false, reason:"Take Picture opens every morning at 7:00 AM."};
  if (mine) return {n, can:false, reason:"You have already taken your picture today."};
  if (n >= FUN_MAX) return {n, can:false, reason:"All 5 pictures are taken for today. Come back tomorrow at 7:00 AM."};
  return {n, can:true, reason:"Open now - tap the button to take your picture."};
}
function fun(){
  subFun(); ensureWinner(); funCleanup();
  const st = funState(); let lower;
  if (fwin) { const w = fpics.find(p => p.id === fwin.pic);
    lower = `<h2>Picture of the Day</h2>` + (w ? `<div class="card potd"><img data-lb alt="" src="${fsrc(w)}"></div><small>The Picture of the Day stays until 7:00 AM tomorrow.</small>` : `<div class="card"><p>The Picture of the Day is not available.</p></div>`); }
  else lower = `<h2>Today's Clicks</h2>` + (foff() >= FUN_CLOSE && fpics.length ? `<p><small>Selecting the Picture of the Day…</small></p>` : "")
    + (fpics.length ? `<div class="thumbs">${fpics.map(p => `<img data-lb loading="lazy" alt="" src="${fsrc(p)}">`).join("")}</div>` : "<p>No pictures yet today.</p>");
  return `<h2>${esc(g("fun_title"))}</h2><div class="card"><p>${esc(g("fun_info"))}</p></div>${funNote ? `<p class="ok">${esc(funNote)}</p>` : ""}
   <button class="full" id="takepic" ${st.can ? "" : "disabled"}>📸 Take Picture</button><p><small>${esc(st.reason)}</small></p>
   <p><small>${esc(T("Pictures taken today:"))} ${dnum(Math.min(st.n, FUN_MAX))}/${dnum(FUN_MAX)}</small></p>${lower}`;
}
function initFun(){ const b = $("takepic"); if (b) b.onclick = () => { if (funState().can) openCam(); }; }
function funAdmin(){
  subFun(); const n = Math.max(fcount, fpics.length);
  return `<div class="card"><p><b>${esc(T("Pictures taken today:"))} ${dnum(Math.min(n, FUN_MAX))}/${dnum(FUN_MAX)}</b></p><small>The admin can delete any picture at any time.</small></div>`
    + (fpics.length ? `<div class="thumbs adm">${fpics.map(p => `<div><img data-lb alt="" src="${fsrc(p)}">${fwin && fwin.pic === p.id ? '<span class="pill">★ Picture of the Day</span>' : ""}<button class="sm del" data-act="delFun" data-id="${p.id}">Delete</button></div>`).join("")}</div>` : "<p>No pictures yet today.</p>");
}
// ---- camera (live camera only; nothing can be uploaded from the gallery) ----
function camRow(html){ $("camrow").innerHTML = html; }
async function openCam(){
  const el = $("cam"); el.style.display = "flex"; camShot = null;
  el.innerHTML = `<video id="camv" autoplay playsinline muted></video><img id="camp" alt="" style="display:none"><p id="camm" class="ld">Opening the camera…</p><div class="camrow" id="camrow"></div>`;
  camLive(); await startCam();
}
function camLive(){
  camRow(`<button id="camcap">Capture</button><button id="camsw" class="gold">Switch camera</button><button id="camx" class="del">Cancel</button>`);
  $("camx").onclick = closeCam; $("camcap").onclick = shoot; $("camsw").onclick = () => { camFacing = camFacing === "user" ? "environment" : "user"; startCam(); };
}
async function startCam(){
  stopCam(); const v = $("camv"), im = $("camp"); if (!v) return; im.style.display = "none"; v.style.display = "block";
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { fallbackShot(); return; }
  try { camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:camFacing}, width:{ideal:1280}}, audio:false});
    v.srcObject = camStream; await v.play().catch(() => {}); $("camm").textContent = ""; }
  catch (e) { const m = $("camm"); if (m) m.textContent = T("Could not open the camera. Please allow camera access."); }
}
function stopCam(){ if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function closeCam(){ stopCam(); $("cam").style.display = "none"; $("cam").innerHTML = ""; }
function showShot(b64){
  camShot = b64; stopCam(); const v = $("camv"), im = $("camp"); v.style.display = "none"; im.src = "data:image/jpeg;base64," + b64; im.style.display = "block"; $("camm").textContent = "";
  camRow(`<button id="camok">Send</button><button id="camre" class="gold">Retake</button><button id="camx" class="del">Cancel</button>`);
  $("camx").onclick = closeCam; $("camre").onclick = () => { camLive(); startCam(); }; $("camok").onclick = sendShot;
}
function shoot(){
  const v = $("camv"); if (!v || !v.videoWidth) return;
  const sc = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)), c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * sc); c.height = Math.round(v.videoHeight * sc);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height); showShot(c.toDataURL("image/jpeg", .6).split(",")[1]);
}
function fallbackShot(){                  // only for old browsers without a live camera: opens the phone's camera app
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "user");
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; const img = new Image(); img.onload = () => { const sc = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(img.src); showShot(c.toDataURL("image/jpeg", .6).split(",")[1]); }; img.src = URL.createObjectURL(f); };
  inp.click();
}
async function sendShot(){
  const d = fday(), owner = devId(), id = d + "_" + owner, m = $("camm"); m.textContent = T("Sending…");
  const b = db.batch(); b.set(db.collection("funPics").doc(id), {day:d, owner, data:camShot, createdAt:Date.now()});
  b.set(db.collection("funDays").doc(String(d)), {count:firebase.firestore.FieldValue.increment(1), last:id, day:d}, {merge:true});
  try { await b.commit(); closeCam(); funNote = T("✔ Your picture is in!"); setTimeout(() => { funNote = ""; dataChanged(); }, 8000); dataChanged(); }
  catch (e) { const mm = $("camm"); if (mm) mm.textContent = T("Could not send the picture. It may be full or closed. Try again later."); }
}

// ---------- video: check length, shrink in the phone, save in small pieces inside Firestore ----------
const VERR = {long:"Video is longer than 30 seconds. Please use a shorter video.", read:"This video could not be read. Try another video.", nosupport:"Video recording is not supported on this phone or browser.", big:"Video is too large after compression. Please record a shorter or simpler video.", net:"Could not upload the video. Check your internet and try again."};
const blobToB64 = blob => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
async function encodeVideo(file, say){
  const url = URL.createObjectURL(file), v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
  try {
    await new Promise((ok, no) => { v.onloadedmetadata = ok; v.onerror = () => no(new Error("read")); });
    const dur = v.duration; if (!isFinite(dur) || !v.videoWidth) throw new Error("read");
    if (dur > 30.5) throw new Error("long");
    const sc = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight)), w = Math.max(2, Math.round(v.videoWidth * sc / 2) * 2), h = Math.max(2, Math.round(v.videoHeight * sc / 2) * 2);
    const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const cx = cv.getContext("2d");
    const seek = t => new Promise(ok => { v.onseeked = ok; v.currentTime = t; });
    await seek(Math.min(0.5, dur / 2));
    const pc = document.createElement("canvas"); pc.width = 240; pc.height = Math.max(2, Math.round(240 * h / w)); pc.getContext("2d").drawImage(v, 0, 0, pc.width, pc.height);
    const poster = pc.toDataURL("image/jpeg", .6).split(",")[1];
    if (file.size <= 1.6e6 && /^video\/(mp4|webm)$/.test(file.type)) return {blob:file, mime:file.type, poster, dur};   // already small
    await seek(0);
    const mime = ["video/mp4;codecs=avc1.42E01E","video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    if (!mime || !cv.captureStream) throw new Error("nosupport");
    const stream = cv.captureStream(24), rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:400000}), parts = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) parts.push(e.data); };
    const stopped = new Promise(ok => rec.onstop = ok);
    rec.start(1000); cx.drawImage(v, 0, 0, w, h);
    const draw = setInterval(() => cx.drawImage(v, 0, 0, w, h), 1000 / 24);
    const prog = setInterval(() => say(T("Processing video… keep this screen open") + ` ${Math.min(Math.round(v.currentTime), Math.round(dur))}/${Math.round(dur)}s`), 1000);
    try { await v.play().catch(() => { throw new Error("read"); }); await new Promise(ok => { v.onended = ok; setTimeout(ok, (dur + 2) * 1000); }); }
    finally { clearInterval(draw); clearInterval(prog); }
    rec.stop(); await stopped; stream.getTracks().forEach(t => t.stop());
    const type = mime.split(";")[0];
    return {blob:new Blob(parts, {type}), mime:type, poster, dur};
  } finally { URL.revokeObjectURL(url); }
}
async function saveVideo(file, say){
  const r = await encodeVideo(file, say), b64 = await blobToB64(r.blob);
  if (b64.length > 4000000) throw new Error("big");
  const parts = []; for (let i = 0; i < b64.length; i += 600000) parts.push(b64.slice(i, i + 600000));
  const ref = db.collection("videos").doc();
  for (let i = 0; i < parts.length; i++) { say(T("Uploading video…") + ` ${i + 1}/${parts.length}`); await ref.collection("chunks").doc(String(i).padStart(3, "0")).set({i, data:parts[i]}); }
  await ref.set({mime:r.mime, dur:Math.round(r.dur), poster:r.poster, chunks:parts.length, size:r.blob.size, createdAt:Date.now()});   // written last, so clients never see half a video
}
async function deleteVideo(id){
  const ref = db.collection("videos").doc(id), q = await ref.collection("chunks").get(), b = db.batch();
  q.docs.forEach(d => b.delete(d.ref)); b.delete(ref); await b.commit();
}

async function playVideo(id){
  openLb(`<p class="ld">${esc(T("Loading video…"))}</p>`);
  try {
    let url = vidCache[id];
    if (!url) { const meta = vids.find(x => x.id === id), q = await db.collection("videos").doc(id).collection("chunks").orderBy("i").get();
      const blob = await (await fetch(`data:${meta.mime};base64,${q.docs.map(d => d.data().data).join("")}`)).blob(); url = vidCache[id] = URL.createObjectURL(blob); }
    openLb(`<video controls autoplay muted playsinline src="${url}"></video>`);
    $("lbc").querySelector("video").onerror = () => { $("lbc").innerHTML = `<p class="ld">${esc(T("This video can't be played on this device."))}</p>`; };
  } catch (e) { openLb(`<p class="ld">${esc(T("Could not load the video. Check your internet."))}</p>`); }
}

function initAdmin(){
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("go", () => { $("go").disabled = true; auth.signInWithEmailAndPassword($("ae").value.trim(), $("ap").value)

  on("mpost", async () => { const t = $("mtext").value.trim(); if (!t) { $("msg").innerHTML = '<span class="err">Type a message first.</span>'; return; }
    $("msg").textContent = T("Saving and translating…");
    try { const b = await bilingual(t), n = Date.now(); await db.collection("messages").add({text:b.en, textMr:b.mr, createdAt:n, updatedAt:n});
      $("mtext").value = ""; $("msg").innerHTML = '<span class="ok">✔ Posted. Clients can see it now.</span>'; }
    catch (e) { $("msg").innerHTML = '<span class="err">Could not post. Check you are logged in and the database rules are updated.</span>'; } });
  on("save", async () => { const msg = $("msg"); msg.textContent = T("Saving and translating…");
    const o = {}, jobs = [], changed = [];
    document.querySelectorAll("[data-k]").forEach(t => { const k = t.dataset.k, v = t.value.trim();
      if (["phone","phone2","whatsapp"].includes(k)) { o[k] = v; return; }

    try { await Promise.all(jobs); await cfg.doc("content").set(o, {merge:true}); changed.forEach(t => t.defaultValue = t.value); msg.innerHTML = '<span class="ok">✔ Saved. Clients now see the changes.</span>'; }
    catch (e) { msg.innerHTML = '<span class="err">Could not save.</span>'; } });
  on("svsave", async () => { $("msg").textContent = T("Saving and translating…");
    const bi = async (o, k) => (o._d && o._d[k] !== undefined) ? bilingual(o._d[k]) : {en:o[k] || "", mr:o[k + "_mr"] || MR[o[k]] || ""};
    try { const items = await Promise.all(svcDraft.map(async s => { const [n, sb] = await Promise.all([bi(s, "name"), bi(s, "sub")]);
        const groups = await Promise.all((s.groups || []).map(async gr => { const l = await bi(gr, "label"); return {label:l.en.trim(), label_mr:l.mr.trim(), times:gr.times.map(t => t.trim()).filter(Boolean)}; }));
        return {name:n.en.trim() || "Service", name_mr:n.mr.trim(), sub:sb.en.trim(), sub_mr:sb.mr.trim(), onDemand:isOD(s), fare:String(s.fare || "0"), groups}; }));
      await cfg.doc("services").set({items}); svcDraft = JSON.parse(JSON.stringify(items)); render();
      $("msg").innerHTML = '<span class="ok">✔ Services saved. Clients now see the new timings.</span>'; }
    catch (e) { $("msg").innerHTML = '<span class="err">Could not save.</span>'; } });
  const say = m => { const el = $("msg"); if (el) el.textContent = m; };
  const imgUp = async inp => { const files = [...inp.files]; inp.value = ""; say(T("Uploading...")); for (const file of files) await addPhoto(file); say(T("Done.")); };
  const vidUp = async inp => { const files = [...inp.files]; inp.value = "";
    for (const file of files) { try { await saveVideo(file, say); say(T("✔ Video added.")); } catch (e) { say(T(VERR[e.message] || VERR.net)); } } };
  [["f", imgUp], ["fcam", imgUp], ["fv", vidUp], ["fvcam", vidUp]].forEach(([id, fn]) => { const el = $(id); if (el) el.onchange = () => fn(el); });
  [1, 2].forEach(n => { const e = $("en" + n); if (e) e.onchange = () => cfg.doc("location").set({["b" + n + "_enabled"]: e.checked}, {merge:true}); });
  const c1 = $("c1b"), c2 = $("c2b");
  if (c1) c1.onchange = () => cfg.doc("location").set({cell1Boat:+c1.value}, {merge:true});
  if (c2) c2.onchange = () => cfg.doc("location").set({cell2Boat:+c2.value}, {merge:true});
  const me = $("meCell"); if (me) { me.value = getMe(); me.onchange = () => setMe(me.value); }
  const au = $("locAuto"); if (au) au.onchange = async () => { if (au.checked) { await startTrack(); au.checked = !!watch; } else stopTrack(); };
  locStatus();
}
function locStatus(){ [1, 2].forEach(n => { const el = $("locstat" + n), b = boatLoc(n);
  if (el) el.innerHTML = `<small>Clients see: ${b.enabled ? "<b>location ON</b>" : "<b>location OFF</b>"}${b.updatedAt ? " · last update " + esc(ago(b.updatedAt)) : ""}</small>`; }); }

// ---------- GPS ----------
const cap = () => window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Geolocation;
function sendLoc(n, lat, lng){ const p = "b" + n + "_"; cfg.doc("location").set({[p + "lat"]:lat, [p + "lng"]:lng, [p + "updatedAt"]:Date.now()}, {merge:true}); }
function getPos(){ const c = cap(); if (c) return c.getCurrentPosition({enableHighAccuracy:true}).then(p => p.coords);
  return new Promise((ok, no) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => ok(p.coords), no, {enableHighAccuracy:true}) : no()); }
async function startTrack(){
  const on = p => { if (!p) return; const n = Date.now(); if (n - lastSend < 15000) return; lastSend = n; sendLoc(thisBoat(), p.coords.latitude, p.coords.longitude); };
  try { const c = cap();
    if (c) { await c.requestPermissions(); watch = {c, id: await c.watchPosition({enableHighAccuracy:true}, (p) => on(p))}; }
    else if (navigator.geolocation) watch = {id: navigator.geolocation.watchPosition(on, () => alert(T("Could not read GPS. Allow location permission.")), {enableHighAccuracy:true, maximumAge:10000})};
  } catch (e) { alert(T("Location permission is needed.")); }
}
function stopTrack(){ if (!watch) return; try { watch.c ? watch.c.clearWatch({id:watch.id}) : navigator.geolocation.clearWatch(watch.id); } catch (e) {} watch = null; }

// ---------- PHOTO UPLOAD (stored inside Firestore, no paid Storage needed) ----------
function addPhoto(file){ return new Promise(res => {
  const done = data => db.collection("gallery").add({...data, createdAt:Date.now()}).then(res, res);
  if (file.type === "image/gif" && file.size < 700 * 1024) { const r = new FileReader(); r.onload = () => done({data:String(r.result).split(",")[1], mime:"image/gif"}); r.onerror = res; r.readAsDataURL(file); return; }
  const img = new Image(); img.onload = () => {
    const s = Math.min(1, 1100 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src); done({data:c.toDataURL("image/jpeg", .72).split(",")[1], mime:"image/jpeg"}); };
  img.onerror = res; img.src = URL.createObjectURL(file); }); }

$("hdr").addEventListener("click", e => { const b = e.target.closest("[data-lang]"); if (b) setLang(b.dataset.lang); });
new MutationObserver(ms => { if (lang !== "mr") return; ms.forEach(m => { if (m.type === "characterData") trNode(m.target); m.addedNodes.forEach(trNode); }); })
  .observe(document.body, {childList:true, subtree:true, characterData:true});
document.documentElement.lang = lang === "mr" ? "mr" : "en";
setInterval(tick, 20000); document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick(); heartbeat(); } });
visitorsInit(); setInterval(heartbeat, 60000); heartbeat();
render();
if ("serviceWorker" in navigator && !window.Capacitor && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
